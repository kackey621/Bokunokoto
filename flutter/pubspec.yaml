name: bokunokoto
description: "Person-first disclosure vault for iOS, Android, and Web."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Auth
  firebase_core: ^2.27.1
  firebase_auth: ^4.20.0

  # HTTP Client
  dio: ^5.4.3

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.5

  # Content Rendering
  flutter_markdown: ^0.6.18
  flutter_html: ^3.1.0
  webview_flutter: ^4.7.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.1.0

  # NFC (for #59)
  nfc_manager: ^3.3.0

  # Platform Channels
  flutter_vibrate: ^1.3.0
  flutter_tts: ^2.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  crypto: ^3.0.3

  # Clipboard
  clipboard: ^0.1.3

  # Time & Date
  quiver: ^3.2.1

  # Animations
  flutter_staggered_animations: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.5.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

scripts:
  codegen:
    - dart run build_runner build
