services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -lc "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: bokunokoto
      DB_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3001
      FIREBASE_PROJECT_ID: bokunokoto-tell-you-myprofile
    ports:
      - "${RAILS_PORT:-3000}:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -lc "bundle exec sidekiq"
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: bokunokoto
      DB_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3001
      FIREBASE_PROJECT_ID: bokunokoto-tell-you-myprofile
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bokunokoto_development
      MYSQL_USER: bokunokoto
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  bundle:
  mysql_data:
