<%
  # HIGH-011: in production, refuse to fall back to the literal string
  # "password" — a missing DB_PASSWORD env var must crash boot loudly.
  # Dev/test keep the convenient default so `docker compose up` and the
  # test suite continue to work without env wiring.
  production = Rails.env.production?
  db_host_default     = production ? nil : "localhost"
  db_username_default = production ? nil : "bokunokoto"
  db_password_default = production ? nil : "password"
%>
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host:     <%= db_host_default     ? ENV.fetch("DB_HOST",     db_host_default)     : ENV.fetch("DB_HOST") %>
  port:     <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= db_username_default ? ENV.fetch("DB_USERNAME", db_username_default) : ENV.fetch("DB_USERNAME") %>
  password: <%= db_password_default ? ENV.fetch("DB_PASSWORD", db_password_default) : ENV.fetch("DB_PASSWORD") %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "bokunokoto_development") %>
  admin:
    <<: *default
    database: <%= ENV.fetch("ADMIN_DB_NAME", "bokunokoto_admin_development") %>
    migrations_paths: db/admin_migrate

test:
  primary:
    adapter: sqlite3
    database: storage/test.sqlite3
    pool: 5
  admin:
    adapter: sqlite3
    database: storage/admin_test.sqlite3
    pool: 5
    migrations_paths: db/admin_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "bokunokoto_production") %>
  admin:
    <<: *default
    database: <%= ENV.fetch("ADMIN_DB_NAME", "bokunokoto_admin_production") %>
    migrations_paths: db/admin_migrate
