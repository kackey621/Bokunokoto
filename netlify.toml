[build]
  publish = "site"
  command = "bash scripts/build-docs.sh"

[build.environment]
  PYTHON_VERSION = "3.10"
  NODE_VERSION = "18"
  # Prevent Netlify from attempting to install Rails dependencies
  # The Gemfile in root is for the Rails backend only; docs build uses Python/mkdocs
  # Setting RUBY_VERSION to none prevents bundler from running
  RUBY_VERSION = "none"
