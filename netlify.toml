[build]
  publish = "site"
  command = "bash scripts/build-docs.sh"

[build.environment]
  PYTHON_VERSION = "3.10"
  NODE_VERSION = "18"
  # Install a real Ruby so bundler doesn't error on RUBY_VERSION lookup,
  # but exclude every gem group so nothing is compiled or downloaded.
  RUBY_VERSION = "3.3.7"
  BUNDLE_WITHOUT = "default:development:test"
